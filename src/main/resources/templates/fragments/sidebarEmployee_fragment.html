<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Sidebar employee</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

</head>
<body>
<div id="sidebarContent" th:fragment="sidebarContent" class="d-flex flex-column flex-shrink-0 p-3">
  <div class="sidebar-header">
    <a class="d-flex align-items-center text-white text-decoration-none">
      <svg class="bi me-2" width="40" height="32"><use xlink:href="#bootstrap"/></svg>
      <span class="fs-4">Menu</span>
    </a>
  </div>
  <hr>
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
      <a th:href="@{/dashboardEmployee}" class="nav-link active" aria-current="page">
        <svg class="bi me-2" width="16" height="16"><use xlink:href="#home"/></svg>
        Home
      </a>
    </li>
    <!-- Dropdown menu's voor de sidebar -->
    <li class="nav-item dropdown">
      <a href="#" class="nav-link dropdown-toggle" id="myWorkplaceDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <svg class="bi me-2" width="16" height="16"><use xlink:href="#speedometer2"/></svg>
        My workplace
      </a>
      <ul class="dropdown-menu" aria-labelledby="myWorkplaceDropdown">
        <li><a th:href="@{/placeholder}" class="dropdown-item">Mijn beschikbaarheden</a></li>
      </ul>
    </li>
    <li class="nav-item dropdown">
      <a href="#" class="nav-link dropdown-toggle" id="testDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <svg class="bi me-2" width="16" height="16"><use xlink:href="#speedometer2"/></svg>
        Mijn gegevens
      </a>
    </li>
    <li class="nav-item">
      <a href="#" class="nav-link dropdown-toggle" id="testDropdown2" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <svg class="bi me-2" width="16" height="16"><use xlink:href="#speedometer2"/></svg>
        Test menu 2
      </a>
      <ul class="dropdown-menu" aria-labelledby="testDropdown2">
        <li><a class="dropdown-item" href="#">Submenu 1</a></li>
        <li><a class="dropdown-item" href="#">Submenu 2</a></li>
      </ul>
    </li>
    <li class="nav-item">
      <a href="#" class="nav-link dropdown-toggle" id="testDropdown3" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <svg class="bi me-2" width="16" height="16"><use xlink:href="#speedometer2"/></svg>
        Test menu 3
      </a>
      <ul class="dropdown-menu" aria-labelledby="testDropdown3">
        <li><a class="dropdown-item" th:href="@{/newEmployee}">Submenu 1</a></li>
        <li><a class="dropdown-item" href="#">Submenu 2</a></li>
        <li><a class="dropdown-item" href="#">Submenu 3</a></li>
      </ul>
    </li>
  </ul>
  <hr>
  <div class="dropdown">
    <a href="#" class="dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
      <img th:src="@{/images/dashboardEmployee/Wutang.png}" alt="Wu-Tang Clan" width="32" height="32" class="rounded-circle me-2">
      <strong>Soner</strong>
    </a>
    <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
      <li><a class="dropdown-item" href="#">Mijn profiel</a></li>
      <li><a class="dropdown-item" href="#">Instellingen</a></li>
      <li><hr class="dropdown-divider"></li>
      <li><a class="dropdown-item" th:href="@{/}">Uitloggen</a></li>
    </ul>
  </div>
  <div class="sidebar-footer">
    <div class="toggle">
      <span>Dark Mode</span>
      <div class="dark-mode-switch">
        <div class="dark-mode-switch-ident"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
