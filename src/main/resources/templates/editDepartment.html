<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:background-color="http://www.w3.org/1999/xhtml">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <link th:href="@{/css/stylesheet.css}" type="text/css" rel="stylesheet">
  <title>Digital Planner</title>
</head>
<body>
<div class="container-flex">

  <!-- Insert sidebar fragment based on user role -->
  <div th:if="${isAdmin}">
    <div th:insert="~{fragments/sidebarAdmin_fragment :: sidebarContent}"></div>
  </div>
  <div th:unless="${isAdmin}">
    <div th:insert="~{fragments/sidebarUser_fragment :: sidebarContent}"></div>
  </div>

  <div class="row justify-content-center">
    <div class="col-6">

      <div class="card" id="popupCard">
        <div class="card-header">
          <h3>Edit Department</h3>
        </div>
        <div class="card-body">

          <!-- Form for editing Department -->
          <form th:action="@{/editDepartment/} + ${department.departmentName}" th:object="${department}" method="post">
            <div class="mb-5">

              <div>
                <label class="form-label">Edit Department
                  <input th:field="*{departmentName}" type="text" class="form-control">
                </label>
              </div>

              <br>
              <a class="btn btn-primary" type="button" th:href="@{/department}">Go back</a>
              <button class="btn btn-primary" type="submit">Save</button>
            </div>
            <p class="text-danger" th:if="${#fields.hasErrors('departmentName')}" th:errors="*{departmentName}"></p>
            <div class="invalid-feedback">DepartmentName address is required</div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
