<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link th:href="@{/css/stylesheet.css}" type="text/css" rel="stylesheet">
    <title>Week Planning Proposal</title>
</head>
<body>

<div class="container" id="weekPlanningContainer">
    <h2 class="text-white text-center">Week Planning Proposal</h2>
    <div class="row">


        <div class="col" th:each="planning, iStat : ${weekWrapper}">
            <div class="card bg-dark text-white mb-3">
                <div class="card-header text-center">
                    <h6>
                        <span th:text="${planning.workingDayDto.date.dayOfWeek}"></span><br>
                        <span th:text="${#temporals.format(planning.workingDayDto.date, 'dd-MM-yy')}"></span>
                    </h6>
                </div>
                <table class="table table-dark table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Staff Name</th>
                        <th>Shift</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="detail, jStat : ${planning.planningDetails}">

                        <td th:text="${detail.staff.firstName} + ', ' +  ${detail.staff.lastName}"></td>

                        <td th:if="${detail.startTime != null}"
                            th:text="${detail.startTime} + ' - ' + ${detail.endTime}"></td>
                        <td th:unless="${detail.startTime != null}" th:text="'FREE!'"></td>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col text-center">

                <a class="btn btn-danger mx-2" th:href="@{/rangeWeek}">Disapprove / Regenerate</a>

                <a class="btn btn-success mx-2" th:href="@{/dashboard}">Approve / Finalize</a>
            </div>
        </div>

        <!--            <div class="row mt-4">-->
        <!--                <div class="col text-center">-->
        <!--&lt;!&ndash;                    <button class="btn btn-danger mx-2" type="submit" formaction="@{/weekPlanning/disapprove}">Disapprove / Regenerate</button>&ndash;&gt;-->
        <!--                    <button class="btn btn-success mx-2" type="submit">Approve / Finalize</button>-->
        <!--                </div>-->
        <!--            </div>-->
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
