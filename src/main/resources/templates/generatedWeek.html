<head>

                    <div class="card-header text-center">

                        </thead>
                        <tbody>

<!--                            <input type="hidden" th:name="weekPlanning[__${iStat.index}__].planningDetails[__${jStat.index}__].endTime" th:value="${detail.endTime}" />-->
<!--                        </tr>-->
                        </tbody>
                    </table>
