<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <link th:href="@{/css/stylesheet.css}" type="text/css" rel="stylesheet">
    <title>Week Planning Proposal</title>

</head>
<body>

<div class="container" id="weekPlanningContainer">
    <h2 class="text-white text-center" >Week Planning Proposal</h2>

    <div class="row">
        <div class="col" th:each="planning : ${weekPlanning}">
            <div class="card bg-dark text-white mb-3">
                <div class="card-header text-center">

                    <h6>
                        <span th:text="${planning.workingDayDto.date.dayOfWeek}"></span><br>
                        <span th:text="${#temporals.format(planning.workingDayDto.date, 'dd-MM-yy')}"></span>
                    </h6>


                </div>
                <table class="table table-dark table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Staff Name</th>
                        <th>Shift</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="detail : ${planning.planningDetails}">
                        <td th:text="${detail.staff}"></td>
                        <td th:text="${detail.startTime} + ' - ' + ${detail.endTime}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


<div class="row mt-4">
    <div class="col text-center">
        <form th:action="@{/disapprove}" method="post" style="display:inline;">
            <button class="btn btn-danger mx-2" type="submit">Disapprove / Regenerate</button>
        </form>
        <form th:action="@{/approve}" method="post" style="display:inline;">
            <button class="btn btn-success mx-2" type="submit">Approve / Finalize</button>
        </form>
    </div>
</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
