<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Sidebar employee</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <!-- Bootstrap JavaScript -->

</head>
<body>
<div id="sidebarContent" class="d-flex flex-column flex-shrink-0 p-3">
  <div class="sidebar-header">
    <a href="/" class="d-flex align-items-center text-white text-decoration-none">
      <svg class="bi me-2" width="40" height="32"><use xlink:href="#bootstrap"/></svg>
      <span class="fs-4">Menu</span>
    </a>
  </div>
  <hr>
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
      <a href="#" class="nav-link active" aria-current="page">
        <svg class="bi me-2" width="16" height="16"><use xlink:href="#home"/></svg>
        Home
      </a>
    </li>
    <!-- Dropdown menu's voor de sidebar -->
    <li class="nav-item dropdown">
      <a href="#" class="nav-link dropdown-toggle" id="myWorkplaceDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <svg class="bi me-2" width="16" height="16"><use xlink:href="#speedometer2"/></svg>
        My workplace
      </a>
      <ul class="dropdown-menu" aria-labelledby="myWorkplaceDropdown">
        <li><a class="dropdown-item" href="#">Mijn beschikbaarheden</a></li>
        <li><a class="dropdown-item" href="#">Mijn afwezigheden</a></li>
      </ul>
    </li>
    <li class="nav-item dropdown">
      <a href="#" class="nav-link dropdown-toggle" id="testDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <svg class="bi me-2" width="16" height="16"><use xlink:href="#table"/></svg>
        TESTTT
      </a>
      <ul class="dropdown-menu" aria-labelledby="testDropdown">
        <li><a class="dropdown-item" href="#">TEST1</a></li>
        <li><a class="dropdown-item" href="#">TEST2</a></li>
      </ul>
    </li>
    <li class="nav-item">
      <a href="#" class="nav-link">
        <svg class="bi me-2" width="16" height="16"><use xlink:href="#grid"/></svg>
        Products
      </a>
    </li>
    <li class="nav-item">
      <a href="#" class="nav-link">
        <svg class="bi me-2" width="16" height="16"><use xlink:href="#people-circle"/></svg>
        Customers
      </a>
    </li>
  </ul>
  <hr>
  <div class="dropdown">
    <a href="#" class="dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
      <img src="/static/images/dashboardEmployee/Wutang.png" alt="Wu-Tang Clan" width="32" height="32" class="rounded-circle me-2">
      <strong>Soner</strong>
    </a>
    <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
      <li><a class="dropdown-item" href="#">Mijn profiel</a></li>
      <li><a class="dropdown-item" href="#">Instellingen</a></li>
      <li><hr class="dropdown-divider"></li>
      <li><a class="dropdown-item" href="#">Uitloggen</a></li>
    </ul>
  </div>

<!-- Javascript -->
<script th:src="@{/js/dashboard_employee_script.js}"></script>

</html>
