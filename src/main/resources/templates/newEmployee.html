<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:background-color="http://www.w3.org/1999/xhtml">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <link th:href="@{css/stylesheet.css}" type="text/css" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Digital Planner</title>
</head>
<body>

<div class="container-flex">

  <div class="row justify-content-center">
    <div class="col-6">

      <div class="card" id="popupCard">
        <div class="card-header">
          <h3>New employee</h3>
        </div>
        <div class="card-body">

          <form>
            <div class="mb-5">
              <label class="form-label">First name
                <input th:value="${firstName}" type="text" placeholder="first name" class="form-control">
              </label>
              <label class="form-label float-right">Last name
                <input th:value="${lastName}" type="text" placeholder="last name" class="form-control">
              </label>
              <label class="form-label">Birth date
                <input th:value="${startdate}" type="date" class="form-control">
              </label>

              <label class="form-label">Address line 1
                <input th:value="${addressline1}" type="text" placeholder="addressline1" class="form-control">
              </label>
              <label class="form-label">Address line 2
                <input th:value="${addressline1}" type="text" placeholder="addressline2" class="form-control">
              </label>

              <label class="form-label">Zipcode
                <input th:value="${zipcode}" type="text" placeholder="zipcode" class="form-control">
              </label>
              <label class="form-label">City
                <input th:value="${city}" type="text" placeholder="city" class="form-control">
              </label>

              <label class="form-label">Phone number
                <input th:value="${phone}" type="text" placeholder="phonenumber" class="form-control">
              </label>

              <label class="form-label">Email
                <input th:value="${email}" type="email" placeholder="email" class="form-control">
              </label>

              <label class="form-label">Department
                <select class="form-select" aria-label="Default select example">
                  <option value="1">one</option>
                  <option value="2">two</option>
                </select>
              </label>

              <label class="form-label">Superior/Team leader
                <select class="form-select" aria-label="Default select example">
                  <option value="1">one</option>
                  <option value="2">two</option>
                </select>
              </label>

              <label class="form-label">Start date
                <input th:value="${startdate}" type="date" class="form-control">
              </label>
            </div>
          </form>

        </div>

      </div>
    </div>
  </div>
</div>

</div>




</body>
</html>
