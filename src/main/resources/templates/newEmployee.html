<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:background-color="http://www.w3.org/1999/xhtml">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <link th:href="@{css/stylesheet.css}" type="text/css" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Digital Planner</title>
</head>
<body>

<div class="container-flex">

  <div class="row justify-content-center">
    <div class="col-6">

      <div class="card" id="popupCard">
        <div class="card-header">
          <h3>New employee</h3>
        </div>
        <div class="card-body">

          <form action="#" th:action="@{/staff}" th:object="${staff}" method="post">
            <div class="mb-5">

              <label class="form-label">First name
                <input th:field="*{staffFirstName}" type="text" placeholder="first name" class="form-control">
              </label>
              <label class="form-label float-right">Last name
                <input th:field="*{StaffLastName}" type="text" placeholder="last name" class="form-control">
              </label>

              <label class="form-label">Address line 1
                <input th:field="*{addressLine1}" type="text" placeholder="addressline1" class="form-control">
              </label>
              <label class="form-label">Address line 2
                <input th:field="*{addressLine2}" type="text" placeholder="addressline2" class="form-control">
              </label>

              <label class="form-label">Zipcode
                <input th:field="*{zipCode}" type="text" placeholder="zipcode" class="form-control">
              </label>
              <label class="form-label">City
                <input th:field="*{city}" type="text" placeholder="city" class="form-control">
              </label>

              <label class="form-label">Phone number
                <input th:field="*{phoneNumber}" type="text" placeholder="phonenumber" class="form-control">
              </label>

              <!--
              <label class="form-label" th:object="${userLogin}">Email
                <input th:field="*{email}" type="email" placeholder="email" class="form-control">
              </label>
              -->

              <label class="form-label" th:object="${department}">Department
                <select  class="form-select" aria-label="Default select example" th:field="*{departmentId}">
                  <option th:each="department: ${departments}" th:value="${department.departmentId}" th:text="${department.departmentName}"></option>
                </select>
              </label>

              <label class="form-label" th:object="${staffFunction}">Staff Function
                <select class="form-select" aria-label="Default select example" th:field="*{staffFunctionId}">
                  <option th:each="staffFunction: ${staffFunctions}" th:value="${staffFunction.staffFunctionId}" th:text="${staffFunction.staffFunctionName}"></option>
                </select>
              </label>


              <label class="form-label" th:object="${staff}">Person in charge
                <select class="form-select" aria-label="Default select example" th:field="*{staffId}">
                  <option th:each="staff: ${staffMembers}" th:value="${staff.staffId}" th:text="${staff.staffFirstName}"></option>
                </select>
              </label>

              <label class="form-label">Start date
                <input th:field="*{startDate}" type="date" class="form-control">
              </label>

              <label class="form-label" th:object="${contractType}">Contract type
                <select  class="form-select" aria-label="Default select example" th:field="*{contractTypeId}">
                  <option th:each="contractType: ${contractTypes}" th:value="${contractType.contractTypeId}" th:text="${contractType.contractTypeName}"></option>
                </select>
              </label>

              <label class="form-label" th:object="${dayOfWeek}">Fixed day off
                <select class="form-select" aria-label="Default select example" th:field="*{daysOfWeekId}">
                  <option th:each="dayOfWeek: ${daysOfWeek}" th:value="${dayOfWeek.daysOfWeekId}" th:text="${dayOfWeek.dayName}"></option>
                </select>
              </label>

              <br>
              <button class="btn btn-primary" type="submit">Create</button>
            </div>
          </form>

        </div>

      </div>
    </div>
  </div>
</div>


</body>
</html>
