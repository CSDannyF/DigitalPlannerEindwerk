<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <!-- CSS stylesheet -->
    <link th:href="@{/css/stylesheet.css}" type="text/css" rel="stylesheet">
</head>

<body>

<div class="dashboard-container">

<!-- Insert sidebar fragment -->
<div th:replace="~{fragments/sidebarAdmin_fragment :: sidebarContent}"></div>





<!-- Insert calendar fragment -->
<div th:replace="~{fragments/calendarMonth_fragment :: calendarMonthContent}"></div>

<!-- <div class="clearfix"></div> -->


    <!-- Error message that fades out -->
    <div th:if="${error}" class="alert alert-danger fade-out mt-3" role="alert">
        <span th:text="${error}"></span>
    </div>



<!-- Place shiftsContainer below calendarMonthContent -->
<div id="shiftsContainer"></div>







<!--TODO trying stuff-->
<div id="thymeleafContent"></div>

<!--error message that fades out-->
<style>
    @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
    }

    .fade-out {
        animation: fadeOut 3s forwards;
        animation-delay: 6s;
    }
</style>


<!-- Background container -->
<div class="background-image"></div>

</div>

</body>
</html>
