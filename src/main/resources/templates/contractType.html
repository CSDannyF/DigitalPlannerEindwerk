<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:background-color="http://www.w3.org/1999/xhtml">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <link th:href="@{css/stylesheet.css}" type="text/css" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Digital Planner</title>
</head>
<body>
<div class="container-flex">

  <div class="row justify-content-center">
    <div class="col-6">

      <div class="card" id="popupCard">
        <div class="card-header">
          <h3>ContractTypes</h3>
        </div>
        <div class="card-body">

          <div>
            <table class="table table-striped table-hover">

              <thead>
              <tr>
                <th>Contract type</th>
                <th>Hours per week</th>
                <th>Edit/Delete</th>
              </tr>
              </thead>

              <tbody>
              <tr th:each="contractType : ${contractTypes}">
                <td th:text="${contractType.contractTypeName}"></td>
                <td th:text="${contractType.hoursPerWeek}"></td>
                <td>
                  <a class="btn btn-primary" th:href="@{/editContractType/} + ${contractType.contractTypeName}">Edit</a>
                  <a class="btn btn-danger" th:href="@{/deleteContractType(contractTypeName=${contractType.contractTypeName})}">Delete</a> <!---->
                </td>
              </tr>
              </tbody>

              <p class="text-danger" th:if="${errorMessage}" th:text="${errorMessage}"></p>

            </table>
          </div>

          <div>
            <form action="#" th:action="@{/contractType}" th:object="${contractType}" method="post">
              <div class="mb-5">

                <label class="form-label">Contract name
                  <input th:field="*{contractTypeName}" type="text" placeholder="name" class="form-control">
                </label>

                <label class="form-label">Hours per week
                  <input th:field="*{hoursPerWeek}" type="text" placeholder="hours" class="form-control">
                </label>

                <p class="text-danger" th:if="${#fields.hasErrors('contractTypeName')}" th:errors="*{contractTypeName}"></p>
                <div class="invalid-feedback"></div>

                <br>
                <a class="btn btn-primary" type="button" th:href="@{/dashboard}">Go back</a>
                <button class="btn btn-primary" type="submit">Save</button>
              </div>
            </form>
          </div>

        </div>

      </div>
     </div>
    </div>
  </div>

</body>
</html>
