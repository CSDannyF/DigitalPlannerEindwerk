<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <link th:href="@{css/stylesheet.css}" type="text/css" rel="stylesheet">

</head>
<body class="bg-light">

<section class="text-center">


    <div class="p-5" id="loginBanner">
        <h1>Digital Planner</h1>
    </div>

            <div class="container" align="center">
                <h1>Opening days company</h1>
                <form action="#" th:action="@{/save_opening_times}" th:object="${OpeningHours}" method="POST">
                    <table class="table">
                        <h4 class="text-primary">Specify the fixed weekly opening days</h4>
                        <h5 class="text-primary">Give opening and closing time and the minimal occupation of each open
                            day</h5>
                        <thead>
                        <tr>
                            <th>Day</th>
                            <th title="Check the box for open days">Open &#9432</th>
                            <th>Opening Time</th>
                            <th>Closing Time</th>
                            <th title="Give the minimal staff occupation for this day ">Minimal Occupation &#9432</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>Monday</td>
                            <td><input type="checkbox"></td>
                            <td><input type="time"></td>
                            <td><input type="time"></td>
                            <td><input type="number" min="0"></td>
                        </tr>
                        <tr>
                            <td>Tuesday</td>
                            <td><input type="checkbox"></td>
                            <td><input type="time"></td>
                            <td><input type="time"></td>
                            <td><input type="number" min="0"></td>
                        </tr>
                        <tr>
                            <td>Wednesday</td>
                            <td><input type="checkbox"></td>
                            <td><input type="time"></td>
                            <td><input type="time"></td>
                            <td><input type="number" min="0"></td>
                        </tr>
                        <tr>
                            <td>Thursday</td>
                            <td><input type="checkbox"></td>
                            <td><input type="time"></td>
                            <td><input type="time"></td>
                            <td><input type="number" min="0"></td>
                        </tr>
                        <tr>
                            <td>Friday</td>
                            <td><input type="checkbox"></td>
                            <td><input type="time"></td>
                            <td><input type="time"></td>
                            <td><input type="number" min="0"></td>
                        </tr>
                        <tr>
                            <td>Saturday</td>
                            <td><input type="checkbox"></td>
                            <td><input type="time"></td>
                            <td><input type="time"></td>
                            <td><input type="number" min="0"></td>
                        </tr>
                        <tr>
                            <td>Sunday</td>
                            <td><input type="checkbox"></td>
                            <td><input type="time"></td>
                            <td><input type="time"></td>
                            <td><input type="number" min="0"></td>
                        </tr>
                        </tbody>
                    </table>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>

</section>
</body>
</html>
