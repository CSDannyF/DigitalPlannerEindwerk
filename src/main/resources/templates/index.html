<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:background-color="http://www.w3.org/1999/xhtml">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <link th:href="@{css/stylesheet.css}" type="text/css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Digital Planner</title>
</head>
    <body>
        <section class="text-center">

            <!-- Upper background gradient -->
            <div class="p-5" id="loginBanner">
                <h1>Digital Planner</h1>
            </div>

            <!-- Login Card -->
            <div class="card w-50 mx-auto">
                <div class="card-body py-5 px-md-5">
                    <div class="row d-flex justify-content-center">
                        <div class="col-lg-8">
                            <h2 class="mb-5">Sign in</h2>
                            <form th:action="@{/loginAdmin}" th:object="${userlogin}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">E-mail adres
                                        <input th:value="${username}" placeholder="Email" class="form-control">
                                    </label>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Wachtwoord
                                        <input type="password" th:value="${password}" placeholder="Password" class="form-control">
                                    </label>
                                </div>
                            </form>
                            <div class="row">
                                <div class="col align-self-center">
                                    <a href="/dashboard_employee" class="btn btn-primary">Inloggen</a>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col align-self-center">
                                    <button class="btn btn-link">Wachtwoord vergeten?</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </body>
</html>
